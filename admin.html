<!DOCTYPE html>
<html lang="en" data-theme="glass">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trivia Night Pro — Admin Panel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>Trivia Night Pro — Admin Panel</div>
  <div class="topbar-controls">
    <a href="index.html" class="btn btn-sm">🏠 Back to Home</a>
  </div>
</div>

<div class="admin-wrap">

  <div class="admin-toolbar glass" style="padding:1rem;">
    <button class="btn btn-sm btn-primary" id="btnNewPack">＋ New Pack</button>
    <button class="btn btn-sm" id="btnLoadPack">📂 Load Pack</button>
    <button class="btn btn-sm" id="btnDuplicatePack">⧉ Duplicate</button>
    <button class="btn btn-sm" id="btnImportJson">⬆ Import JSON</button>
    <button class="btn btn-sm" id="btnExportJson">⬇ Export JSON</button>
    <button class="btn btn-sm btn-danger" id="btnDeletePack">🗑 Delete</button>
    <button class="btn btn-sm btn-success" id="btnSavePack">💾 Save Pack</button>
  </div>

  <div class="glass" style="padding:1.2rem; margin-top:1rem;">
    <div class="field-row">
      <div class="field">
        <label for="packNameInput">Pack Name</label>
        <input type="text" id="packNameInput" placeholder="e.g. Christmas Trivia" />
      </div>
      <div class="field" style="max-width:220px;">
        <label for="packThemeInput">Default Theme</label>
        <select id="packThemeInput">
          <option value="glass">Modern Glass</option>
          <option value="classic">Classic Jeopardy</option>
          <option value="graffiti">Hip-Hop Graffiti</option>
          <option value="neon">Neon</option>
          <option value="dark">Dark Mode</option>
          <option value="gold">Gold</option>
        </select>
      </div>
    </div>
  </div>

  <h2 style="font-family:var(--font-display); font-size:1.1rem; margin:1.4rem 0 0.6rem;">Categories &amp; Questions</h2>
  <div id="categoryEditor"></div>

  <div class="glass" style="padding:1.2rem; margin-top:1rem;">
    <h2 style="font-family:var(--font-display); font-size:1.05rem; margin-bottom:0.8rem;">Final Jeopardy</h2>
    <div class="field">
      <label for="fjCategory">Category</label>
      <input type="text" id="fjCategory" />
    </div>
    <div class="field">
      <label for="fjQuestion">Question</label>
      <textarea id="fjQuestion"></textarea>
    </div>
    <div class="field">
      <label for="fjAnswer">Answer</label>
      <textarea id="fjAnswer"></textarea>
    </div>
  </div>

  <div style="height:3rem;"></div>
</div>

<div id="modalLoadPack" class="modal-overlay hidden">
  <div class="modal modal-lg glass">
    <div class="modal-header">
      <h2>Load Pack to Edit</h2>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="pack-grid" id="adminPackGrid"></div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="admin.js"></script>
</body>
</html>
